<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>
    <header>
        <h1>Ciber Segurança UPF</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="content1.html">Conteudo 1</a></li>
                <li><a href="content2.html">Conteudo 2</a></li>
                <li><a href="security.html">Segurança</a></li>
                <li><a href="about.html">Sobre</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
        <div class="controls">
            <button id="theme-toggle">Tema</button>
            <button id="font-toggle" title="acessibilidade">
                <span class="material-icons">acessibilidade</span>
            </button>
        </div>
    </header>

    <main>
        <section class="card">
            <h2>Fale Conosco</h2>
            <p>Envie sua mensagem para a equipe do projeto sobre dúvidas ou sugestões referentes à cartilha de cibersegurança.</p>

            <form id="contact-form">
                <div>
                    <label for="nome">Seu Nome:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>
                <br>
                <div>
                    <label for="email">Seu E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                </div>
                <br>
                <div>
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" placeholder="Ex: Dúvida sobre a cartilha" required>
                </div>
                <br>
                <div>
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>
                <br>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Projeto Web Lab / Universidade de Passo Fundo</p>
    </footer>
</body>
</html>
